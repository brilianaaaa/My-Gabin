<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Penjual - My Gabin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { green: '#105948', darkgreen: '#0b3e33', gold: '#d97706' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- HEADER DASHBOARD -->
  <header class="bg-brand-darkgreen text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-400 text-brand-darkgreen rounded-xl flex items-center justify-center font-black text-lg">MG</div>
        <div>
          <h1 class="font-black text-lg leading-none">Dashboard Penjual</h1>
          <span class="text-xs text-amber-300">My Gabin Bangkalan</span>
        </div>
      </div>
      <!-- TOMBOL KHUSUS PENJUAL UNTUK BERALIH KE TAMPILAN PEMBELI -->
      <a href="index.html" class="bg-amber-500 hover:bg-amber-400 text-brand-darkgreen font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-store"></i> Lihat Toko (Tampilan Pembeli)
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- RINGKASAN DATA -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl shadow border">
        <div class="text-xs font-bold text-gray-400">Total Pesanan</div>
        <div id="statTotalOrders" class="text-2xl font-black text-brand-darkgreen">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow border">
        <div class="text-xs font-bold text-gray-400">Pesanan Masuk</div>
        <div id="statPendingOrders" class="text-2xl font-black text-amber-500">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow border">
        <div class="text-xs font-bold text-gray-400">Pesanan Selesai</div>
        <div id="statCompletedOrders" class="text-2xl font-black text-emerald-600">0</div>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow border">
        <div class="text-xs font-bold text-gray-400">Total Pendapatan</div>
        <div id="statRevenue" class="text-xl font-black text-brand-darkgreen">Rp 0</div>
      </div>
    </div>

    <!-- TAB NAVIGASI -->
    <div class="flex border-b border-gray-200">
      <button onclick="switchTab('orders')" id="tabBtnOrders" class="py-2.5 px-5 font-bold text-sm border-b-2 border-brand-green text-brand-green">Daftar Pesanan</button>
      <button onclick="switchTab('products')" id="tabBtnProducts" class="py-2.5 px-5 font-bold text-sm text-gray-500 hover:text-brand-green">Kelola Stok & Produk</button>
    </div>

    <!-- SEKSI PESANAN -->
    <section id="sectionOrders" class="bg-white rounded-2xl shadow border p-4">
      <h2 class="font-black text-lg text-brand-darkgreen mb-4">Daftar Pesanan Masuk</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs md:text-sm">
          <thead class="bg-gray-50 text-gray-600 uppercase border-b">
            <tr>
              <th class="p-3">ID / Waktu</th>
              <th class="p-3">Pemesan</th>
              <th class="p-3">Detail Pesanan</th>
              <th class="p-3">Total & Bayar</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y"></tbody>
        </table>
      </div>
    </section>

    <!-- SEKSI STOK & PRODUK -->
    <section id="sectionProducts" class="hidden bg-white rounded-2xl shadow border p-4 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-black text-lg text-brand-darkgreen">Manajemen Stok & Harga</h2>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="sellerProductGrid"></div>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD__NfI8UCX4z955vq4ERc6TGp4S-e_ZeQ",
      authDomain: "my-gabin.firebaseapp.com",
      projectId: "my-gabin",
      storageBucket: "my-gabin.firebasestorage.app",
      messagingSenderId: "266155899371",
      appId: "1:266155899371:web:22fd94d72803d6e5d341ae",
      measurementId: "G-ZZDF9SV7F2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allOrders = [];
    let allProducts = [];

    // Real-time listener Orders
    db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      allOrders = [];
      snapshot.forEach(doc => allOrders.push({ docId: doc.id, ...doc.data() }));
      renderOrdersUI();
      updateStats();
    });

    // Real-time listener Products
    db.collection('products').onSnapshot(snapshot => {
      allProducts = [];
      snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
      renderSellerProductsUI();
    });

    function updateStats() {
      document.getElementById('statTotalOrders').innerText = allOrders.length;
      document.getElementById('statPendingOrders').innerText = allOrders.filter(o => o.status === 'Menunggu Konfirmasi').length;
      document.getElementById('statCompletedOrders').innerText = allOrders.filter(o => o.status === 'Selesai').length;
      
      const rev = allOrders
        .filter(o => o.status === 'Selesai')
        .reduce((sum, o) => sum + (o.totalPrice || 0), 0);
      document.getElementById('statRevenue').innerText = `Rp ${rev.toLocaleString('id-ID')}`;
    }

    function renderOrdersUI() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = '';

      if (allOrders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Belum ada pesanan masuk.</td></tr>';
        return;
      }

      allOrders.forEach(o => {
        const itemsList = o.items.map(i => `${i.name} x${i.qty}`).join(', ');
        const waLink = `https://wa.me/${o.custWA.replace(/^0/, '62')}?text=Halo%20${encodeURIComponent(o.custName)},%20terima%20kasih%20sudah%20memesan%20My%20Gabin!`;

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3">
              <div class="font-bold">${o.id || o.docId}</div>
              <div class="text-[10px] text-gray-400">${o.dateStr || ''}</div>
            </td>
            <td class="p-3">
              <div class="font-bold">${o.custName}</div>
              <a href="${waLink}" target="_blank" class="text-emerald-600 hover:underline text-xs"><i class="fa-brands fa-whatsapp"></i> ${o.custWA}</a>
              ${o.custMaps ? `<br><a href="${o.custMaps}" target="_blank" class="text-blue-500 underline text-[10px]">Lihat Lokasi Maps</a>` : ''}
            </td>
            <td class="p-3">
              <div class="text-xs font-semibold">${itemsList}</div>
              ${o.custNotes ? `<div class="text-[10px] text-amber-700 bg-amber-50 p-1 rounded mt-1">Catatan: ${o.custNotes}</div>` : ''}
            </td>
            <td class="p-3">
              <div class="font-black text-brand-darkgreen">Rp ${(o.totalPrice || 0).toLocaleString('id-ID')}</div>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-gray-100 border">${o.payMethod}</span>
            </td>
            <td class="p-3">
              <span class="px-2 py-1 rounded-full text-[10px] font-bold ${
                o.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800' :
                o.status === 'Dibatalkan' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'
              }">${o.status}</span>
            </td>
            <td class="p-3 text-center space-x-1">
              <button onclick="updateOrderStatus('${o.docId}', 'Selesai')" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs hover:bg-emerald-700">Selesai</button>
              <button onclick="updateOrderStatus('${o.docId}', 'Dibatalkan')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Batal</button>
            </td>
          </tr>
        `;
      });
    }

    function renderSellerProductsUI() {
      const grid = document.getElementById('sellerProductGrid');
      grid.innerHTML = '';

      allProducts.forEach(p => {
        grid.innerHTML += `
          <div class="bg-gray-50 border rounded-xl p-3 flex items-center gap-3">
            <img src="${p.img}" class="w-16 h-16 object-cover rounded-lg">
            <div class="flex-1 space-y-1">
              <div class="font-bold text-sm">${p.name}</div>
              <div class="text-xs text-gray-500">Harga: Rp ${(p.price || 0).toLocaleString('id-ID')}</div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold">Stok:</span>
                <input type="number" id="stockInput_${p.id}" value="${p.stock}" class="w-16 border rounded px-1.5 py-0.5 text-xs font-bold text-center">
                <button onclick="saveStock('${p.id}')" class="bg-brand-green text-white px-2 py-0.5 rounded text-xs font-bold hover:bg-brand-darkgreen">Simpan</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    async function updateOrderStatus(docId, status) {
      await db.collection('orders').doc(docId).update({ status });
    }

    async function saveStock(id) {
      const newStock = parseInt(document.getElementById(`stockInput_${id}`).value) || 0;
      await db.collection('products').doc(id).update({ stock: newStock });
      alert('Stok berhasil diperbarui!');
    }

    function switchTab(tab) {
      if (tab === 'orders') {
        document.getElementById('sectionOrders').classList.remove('hidden');
        document.getElementById('sectionProducts').classList.add('hidden');
        document.getElementById('tabBtnOrders').className = 'py-2.5 px-5 font-bold text-sm border-b-2 border-brand-green text-brand-green';
        document.getElementById('tabBtnProducts').className = 'py-2.5 px-5 font-bold text-sm text-gray-500 hover:text-brand-green';
      } else {
        document.getElementById('sectionOrders').classList.add('hidden');
        document.getElementById('sectionProducts').classList.remove('hidden');
        document.getElementById('tabBtnOrders').className = 'py-2.5 px-5 font-bold text-sm text-gray-500 hover:text-brand-green';
        document.getElementById('tabBtnProducts').className = 'py-2.5 px-5 font-bold text-sm border-b-2 border-brand-green text-brand-green';
      }
    }
  </script>
</body>
</html>
