<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Penjual - Dashboard My Gabin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { green: '#105948', darkgreen: '#0b3e33', gold: '#d97706', cream: '#fdfbf7' } } } }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <header class="bg-brand-darkgreen text-white shadow-md p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center text-brand-darkgreen font-black text-lg shadow">MG</div>
      <h1 class="text-lg md:text-xl font-black tracking-tight">Dashboard Penjual My Gabin</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnEnableSound" onclick="enableAudioAlert()" class="bg-amber-500 hover:bg-amber-400 text-brand-darkgreen text-xs font-bold px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1.5">
        <i class="fa-solid fa-bell"></i> <span>Aktifkan Suara</span>
      </button>
      <span class="text-xs bg-emerald-800 px-3 py-1.5 rounded-lg text-emerald-200 hidden md:inline-block"><i class="fa-solid fa-cloud"></i> Realtime Cloud Active</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Total Pesanan</div>
        <div id="statOrders" class="text-3xl font-black text-gray-800 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Total Pendapatan</div>
        <div id="statRevenue" class="text-3xl font-black text-brand-green mt-1">Rp 0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Status Notifikasi</div>
        <div id="soundStatus" class="text-xs font-bold text-amber-600 mt-2 flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation"></i> Klik "Aktifkan Suara" di atas
        </div>
      </div>
    </div>

    <!-- ORDER TABLE -->
    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
      <div class="p-4 bg-gray-50 font-bold border-b flex justify-between items-center">
        <span><i class="fa-solid fa-receipt text-brand-green mr-2"></i>Data Pesanan Masuk Real-Time</span>
        <span class="text-xs text-gray-400 font-normal">Otomatis Diperbarui</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-gray-100 border-b text-gray-600 font-bold uppercase">
              <th class="p-3">ID / Tanggal</th>
              <th class="p-3">Nama & WA</th>
              <th class="p-3">Item Pesanan</th>
              <th class="p-3">Pembayaran</th>
              <th class="p-3">Total</th>
              <th class="p-3">Maps & Catatan</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTable" class="divide-y"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD__NfI8UCX4z955vq4ERc6TGp4S-e_ZeQ",
      authDomain: "my-gabin.firebaseapp.com",
      projectId: "my-gabin",
      storageBucket: "my-gabin.firebasestorage.app",
      messagingSenderId: "266155899371",
      appId: "1:266155899371:web:22fd94d72803d6e5d341ae",
      measurementId: "G-ZZDF9SV7F2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let audioEnabled = false;

    // Minta izin notifikasi browser
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function playDingDongSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + start);
          osc.stop(audioCtx.currentTime + start + duration);
        };
        playTone(587.33, 0, 0.2);   // Tone 1 (Ding)
        playTone(880, 0.25, 0.4);   // Tone 2 (Dong)
      } catch (e) {
        console.log("Error memutar audio:", e);
      }
    }

    function enableAudioAlert() {
      playDingDongSound();
      audioEnabled = true;
      document.getElementById('soundStatus').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i> Suara & Notifikasi Aktif';
      document.getElementById('soundStatus').className = 'text-xs font-bold text-emerald-600 mt-2 flex items-center gap-2';
      document.getElementById('btnEnableSound').classList.add('bg-emerald-600', 'text-white');
      document.getElementById('btnEnableSound').innerHTML = '<i class="fa-solid fa-check"></i> Suara Aktif';
    }

    let isInitialLoad = true;

    db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      const tbody = document.getElementById('ordersTable');
      tbody.innerHTML = '';
      let totalRev = 0;

      document.getElementById('statOrders').innerText = snapshot.size;

      // Deteksi pesanan baru untuk pembunyian notifikasi
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added' && !isInitialLoad) {
          const newOrder = change.doc.data();
          
          if (audioEnabled) {
            playDingDongSound();
          }

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("🔔 Pesanan Baru My Gabin!", {
              body: `Dari: ${newOrder.custName}\nTotal: Rp ${newOrder.totalPrice ? newOrder.totalPrice.toLocaleString('id-ID') : 0}`,
              icon: "https://cdn-icons-png.flaticon.com/512/3144/3144456.png"
            });
          }
        }
      });

      snapshot.forEach(doc => {
        const o = doc.data();
        totalRev += o.totalPrice || 0;
        const items = o.items ? o.items.map(i => `<span class="inline-block bg-emerald-50 text-brand-darkgreen border px-1.5 py-0.5 rounded text-[11px] font-semibold my-0.5">${i.name} (x${i.qty})</span>`).join(' ') : '-';
        const maps = o.custMaps ? `<a href="${o.custMaps}" target="_blank" class="text-blue-600 font-bold hover:underline"><i class="fa-solid fa-map-location-dot"></i> Buka Maps</a>` : '<span class="text-gray-400">Tidak ada</span>';

        tbody.innerHTML += `
          <tr class="hover:bg-amber-50/40 transition">
            <td class="p-3 font-medium"><strong>${o.id || doc.id}</strong><br><span class="text-gray-400 text-[10px]">${o.dateStr || ''}</span></td>
            <td class="p-3"><strong>${o.custName}</strong><br><a href="https://wa.me/${o.custWA}" target="_blank" class="text-emerald-700 font-bold"><i class="fa-brands fa-whatsapp"></i> ${o.custWA}</a></td>
            <td class="p-3">${items}</td>
            <td class="p-3 font-semibold text-gray-700">${o.payMethod || 'Cash'}</td>
            <td class="p-3 font-black text-brand-darkgreen">Rp ${o.totalPrice ? o.totalPrice.toLocaleString('id-ID') : 0}</td>
            <td class="p-3">${maps}<br><span class="text-gray-500 italic block mt-0.5">${o.custNotes || '-'}</span></td>
            <td class="p-3"><span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold text-[10px] inline-block">${o.status || 'Menunggu'}</span></td>
          </tr>
        `;
      });

      document.getElementById('statRevenue').innerText = `Rp ${totalRev.toLocaleString('id-ID')}`;
      isInitialLoad = false;
    });
  </script>
</body>
</html>
