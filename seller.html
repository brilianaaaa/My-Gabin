<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Gabin - Portal Penjual</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding-bottom: 50px; }

        header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 25px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        header h1 { font-size: 2rem; margin-bottom: 5px; }

        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #1a237e; }
        .stat-card h4 { color: #666; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; color: #1a237e; }

        /* Form Styling */
        .form-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 30px; }
        .form-card h3 { margin-bottom: 15px; border-bottom: 2px solid #e8eaf6; padding-bottom: 8px; color: #1a237e; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #444; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; outline: none; }
        
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        .btn-save { background: #1a237e; color: white; border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-save:hover { background: #0d47a1; }
        .btn-cancel { background: #757575; color: white; border: none; padding: 11px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }

        /* Table Styling */
        .table-responsive { background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #e8eaf6; color: #1a237e; font-weight: bold; }
        td img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }

        .btn-action { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-edit { background: #ff9800; color: white; margin-right: 5px; }
        .btn-delete { background: #e53935; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Portal Penjual My-Gabin</h1>
        <p>Kelola Produk, Stok, dan Harga Menu Web</p>
    </header>

    <div class="container">
        <!-- Dashboard Summary -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Jenis Menu</h4>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card" style="border-left-color: #2e7d32;">
                <h4>Total Stok Tersedia</h4>
                <div class="value" id="stat-stock">0</div>
            </div>
            <div class="stat-card" style="border-left-color: #c62828;">
                <h4>Menu Stok Habis</h4>
                <div class="value" id="stat-empty">0</div>
            </div>
        </div>

        <!-- Form Tambah / Edit Produk -->
        <div class="form-card">
            <h3 id="form-title">Tambah Menu Produk Baru</h3>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="edit-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="p-name">Nama Produk</label>
                        <input type="text" id="p-name" placeholder="Contoh: Gabin Matcha Lumer" required>
                    </div>
                    <div class="form-group">
                        <label for="p-category">Kategori</label>
                        <select id="p-category" required>
                            <option value="Manis">Manis</option>
                            <option value="Gurih">Gurih / Asin</option>
                            <option value="Spesial">Spesial / Lumer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="p-price">Harga (Rp)</label>
                        <input type="number" id="p-price" placeholder="Contoh: 15000" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="p-stock">Stok Awal</label>
                        <input type="number" id="p-stock" placeholder="Contoh: 20" required min="0">
                    </div>
                    <div class="form-group full">
                        <label for="p-img">URL Gambar Produk</label>
                        <input type="url" id="p-img" placeholder="https://link-gambar.com/foto.jpg">
                    </div>
                    <div class="form-group full">
                        <label for="p-desc">Deskripsi Ringkas</label>
                        <textarea id="p-desc" rows="2" placeholder="Tuliskan rasa dan deskripsi produk..."></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-save" id="btn-save-text">Simpan Produk</button>
                    <button type="button" class="btn-cancel" id="btn-cancel" onclick="resetForm()">Batal Edit</button>
                </div>
            </form>
        </div>

        <!-- Tabel Daftar Produk -->
        <h3 style="margin-bottom: 15px; color: #1a237e;">Daftar Menu Aktif</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Gambar</th>
                        <th>Nama Produk</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="seller-table-body">
                    <!-- Data Produk -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "Gabin Fla Susu", category: "Manis", price: 12000, stock: 15, desc: "Gabin renyah isi fla susu manis lembut.", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300" },
            { id: 2, name: "Gabin Tape Keju", category: "Manis", price: 15000, stock: 10, desc: "Perpaduan tape manis dan taburan keju gurih.", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 3, name: "Gabin Coklat Lumer", category: "Spesial", price: 14000, stock: 8, desc: "Isi coklat melimpah dan lumer di mulut.", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" }
        ];

        function getProducts() {
            return JSON.parse(localStorage.getItem('gabin_products')) || defaultProducts;
        }

        function saveProductsToStorage(data) {
            localStorage.setItem('gabin_products', JSON.stringify(data));
        }

        function renderSellerTable() {
            const products = getProducts();
            const tbody = document.getElementById('seller-table-body');
            tbody.innerHTML = '';

            let totalStock = 0;
            let emptyCount = 0;

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">Belum ada produk. Silakan tambah produk baru.</td></tr>`;
            } else {
                products.forEach(prod => {
                    totalStock += Number(prod.stock);
                    if (prod.stock <= 0) emptyCount++;

                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${prod.img || 'https://via.placeholder.com/100'}" alt="${prod.name}"></td>
                            <td><strong>${prod.name}</strong></td>
                            <td><span style="background:#e8eaf6; padding:3px 8px; border-radius:4px; font-size:0.8rem;">${prod.category}</span></td>
                            <td>Rp ${Number(prod.price).toLocaleString('id-ID')}</td>
                            <td><strong style="color: ${prod.stock > 0 ? '#2e7d32' : '#c62828'};">${prod.stock}</strong></td>
                            <td>
                                <button class="btn-action btn-edit" onclick="editProduct(${prod.id})">Edit</button>
                                <button class="btn-action btn-delete" onclick="deleteProduct(${prod.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            }

            // Update Statistik
            document.getElementById('stat-total').innerText = products.length;
            document.getElementById('stat-stock').innerText = totalStock;
            document.getElementById('stat-empty').innerText = emptyCount;
        }

        function saveProduct(e) {
            e.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('p-name').value;
            const category = document.getElementById('p-category').value;
            const price = Number(document.getElementById('p-price').value);
            const stock = Number(document.getElementById('p-stock').value);
            const img = document.getElementById('p-img').value;
            const desc = document.getElementById('p-desc').value;

            let products = getProducts();

            if (editId) {
                // Update / Edit
                products = products.map(p => {
                    if (p.id == editId) {
                        return { id: Number(editId), name, category, price, stock, img, desc };
                    }
                    return p;
                });
                alert('Produk berhasil diperbarui!');
            } else {
                // Tambah Baru
                const newProduct = {
                    id: Date.now(),
                    name, category, price, stock, img, desc
                };
                products.push(newProduct);
                alert('Produk baru berhasil ditambahkan!');
            }

            saveProductsToStorage(products);
            resetForm();
            renderSellerTable();
        }

        function editProduct(id) {
            const products = getProducts();
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('edit-id').value = prod.id;
            document.getElementById('p-name').value = prod.name;
            document.getElementById('p-category').value = prod.category;
            document.getElementById('p-price').value = prod.price;
            document.getElementById('p-stock').value = prod.stock;
            document.getElementById('p-img').value = prod.img || '';
            document.getElementById('p-desc').value = prod.desc || '';

            document.getElementById('form-title').innerText = 'Edit Menu Produk';
            document.getElementById('btn-save-text').innerText = 'Simpan Perubahan';
            document.getElementById('btn-cancel').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                saveProductsToStorage(products);
                renderSellerTable();
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = 'Tambah Menu Produk Baru';
            document.getElementById('btn-save-text').innerText = 'Simpan Produk';
            document.getElementById('btn-cancel').style.display = 'none';
        }

        // Jalankan awal
        renderSellerTable();
    </script>
</body>
</html>
